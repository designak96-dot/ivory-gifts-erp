; Raises PHP's own upload limits so genuinely large, legitimate uploads
; (e.g. a bulk product-image ZIP) aren't rejected. This only works if
; the request reaches PHP at all — if your host's web server (Apache/
; LiteSpeed/Nginx) has its own request-size cap set lower than this,
; that limit is enforced before PHP ever sees the request, and .user.ini
; cannot override it; contact your host or use cPanel's MultiPHP INI
; Editor in that case.
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
